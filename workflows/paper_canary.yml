name: Paper Execution Canary

on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        default: "what_if"
        type: choice
        options:
          - what_if
          - tiny_paper_order

jobs:
  canary:
    runs-on: [self-hosted, linux, falnama-paper]
    environment: paper-trading
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Run IBKR paper canary
        env:
          FALNAMA_EXECUTION_MODE: "ibkr_paper"
          IBKR_PAPER_ACCOUNT_ID: ${{ secrets.IBKR_PAPER_ACCOUNT_ID }}
        run: |
          python scripts/ibkr_paper_canary.py \
            --mode "${{ inputs.mode }}" \
            --max-notional 10 \
            --instrument-allowlist config/canary_instruments.yaml

      - name: Reconcile canary
        run: |
          python scripts/reconcile_ibkr_paper.py --canary-only
          