name: Daily Paper Trading Report

on:
  schedule:
    - cron: "10 22 * * 1-5"
  workflow_dispatch:

jobs:
  report:
    runs-on: [self-hosted, linux, falnama-paper]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build daily report
        run: |
          python scripts/build_daily_report.py \
            --source repositories/ \
            --output reports/daily/latest.md

      - name: Add report to workflow summary
        run: |
          cat reports/daily/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: falnama-daily-paper-report-${{ github.run_id }}
          path: |
            reports/daily/
            repositories/execution_receipts/
            repositories/run_logs/
            repositories/trade_diagnostics/
          retention-days: 90
          