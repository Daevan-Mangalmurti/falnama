name: Build Paper Bot Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -f docker/paper-bot.Dockerfile \
            -t ghcr.io/${{ github.repository }}/falnama-paper-bot:${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}/falnama-paper-bot:latest \
            .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository }}/falnama-paper-bot:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/falnama-paper-bot:latest