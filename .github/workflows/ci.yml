# CI — the "does the code work?" gate. Runs on every push and pull request:
# lints with ruff and runs the test suite. Fast, deterministic, no network or
# secrets (everything runs against the committed fixtures).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (with dev tools)
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
