# Scheduled research run — the operational spine of Falnama.
#
# It runs the pipeline, uploads the full outputs/ as a downloadable artifact
# (including the .xlsx workbook), and commits the diffable evidence trail
# (JSON/CSV/manifests) back to the repo so the audit history lives in git.
#
# This is now a LIVE research daemon: the committed config fetches real
# Polymarket data and makes real LLM calls (the relevance screen on every run,
# scenario cards for the markets that survive it), so it depends on the
# ANTHROPIC_API_KEY secret wired below. A missing or invalid key does not break
# the run — the screen fails open and keeps every market — but it does mean a
# day of unscreened output, so watch for "screen" errors in the health report.
# To return to a free, deterministic, secret-free run, set data.source: fixtures
# and card_mode: mock in config/falnama.yaml (and screener.mode: mock).
#
# News-lag (Stage 5) adds two more live seams when enabled (newslag.enabled: true,
# mode: live): GDELT (free, keyless — no secret) and, if newslag.embedding.provider
# is 'voyage', hosted embeddings via the VOYAGE_API_KEY secret wired below. Both
# fail SAFE (a missing Voyage key falls back to lexical ranking; a GDELT/LLM outage
# leaves the move UNEXPLAINED rather than dismissed). The [embeddings] extra is
# installed so the voyage path is available; it is inert until the provider is set.
name: Falnama research run

on:
  workflow_dispatch:      # run on demand from the Actions tab
  schedule:
    - cron: "17 7 * * *"  # ~07:17 UTC daily (off the :00 mark on purpose)

# Allow the job to commit the evidence trail back to the repo.
permissions:
  contents: write

concurrency:
  group: falnama-research-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # Includes the [embeddings] extra so news-lag's optional Voyage ranker is
        # available; harmless (and unused) while newslag.embedding.provider: lexical.
        run: pip install -e ".[embeddings]"

      - name: Run the pipeline
        env:
          # Read at runtime only when card_mode/newslag is 'live'.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Read only when newslag.embedding.provider is 'voyage'; if the secret is
          # unset, ranking falls back to lexical (no failure). Add the secret in
          # repo Settings → Secrets and variables → Actions to enable embeddings.
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: python scripts/run.py

      - name: Upload outputs (includes the .xlsx workbook)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falnama-outputs-${{ github.run_id }}
          path: outputs/
          retention-days: 30

      - name: Commit the evidence trail
        run: |
          git config user.name "falnama-bot"
          git config user.email "actions@users.noreply.github.com"
          # Commit the diffable artifacts + any raw snapshots; the binary .xlsx
          # is intentionally git-ignored (download it from the artifact above).
          git add outputs/ data/snapshots/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new artifacts to commit."
          else
            git commit -m "Research run ${{ github.run_id }} [skip ci]"
            git push
          fi
