minimum_expected_move_bps: 700
eligible_anomaly_class: "strong"
paper_trading_only: true
allow_real_broker_execution: false
index_cards_immutable: true
mock_mode: true
scenario_analysis_mock_mode: true
backfill_testing_mode: false
card_generation_mode: "all_markets"
top_n_cards: 20

repositories:
  relevant_markets: "repositories/relevant_markets"
  anomalies: "repositories/anomalies"
  index_cards: "repositories/index_cards"
  recommended_trades: "repositories/recommended_trades"
  run_logs: "repositories/run_logs"
  rejected_signals: "repositories/rejected_signals"
  trade_diagnostics: "repositories/trade_diagnostics"

selector:
  enable_network_fetch: false
  max_markets: 500
  closed_only: true
  min_total_volume: 500
  min_liquidity: 50
  require_keyword_confirmation_even_with_tag: true
  use_mock_if_no_inputs: true
  geopolitics_tag_ids: [...]
  geopolitics_keywords: [...]
  hard_reject_keywords: [...]
  hard_reject_tags: [...]

anomaly_detector:
  min_price_observations: 20
  price_history_interval: "1h"
  price_history_fidelity: 60
  price_history_lookback_days: 14
  top_n_anomalies: 100
  strong_score_threshold: 85
  medium_score_threshold: 70
  weak_score_threshold: 50
  anomaly_cooldown_hours: 6
  use_mock_if_no_inputs: true

legacy_inputs:
  legacy_markets: "pm_geo_anomaly_pilot/raw/markets_closed_geopolitics.csv"
  legacy_token_metadata: "pm_geo_anomaly_pilot/raw/token_metadata.csv"
  legacy_ranked_anomalies: "pm_geo_anomaly_pilot/outputs/ranked_anomalies.csv"
  legacy_strong_anomalies: "pm_geo_anomaly_pilot/outputs/strong_anomalies.csv"
  legacy_anomaly_features: "pm_geo_anomaly_pilot/processed/anomaly_features.csv"
  legacy_price_history_long: "pm_geo_anomaly_pilot/processed/all_price_history_long.csv"

execution:
  mode: "ibkr_paper"          # allowed: dry_run, ibkr_paper
  allow_paper_broker_orders: true
  allow_live_broker_orders: false
  require_paper_account: true
  require_account_allowlist: true
  expected_account_id_env_var: "IBKR_PAPER_ACCOUNT_ID"
  kill_switch_env_var: "FALNAMA_KILL_SWITCH"

ibkr:
  connection_type: "tws_api"  # tws_api or client_portal
  host: "127.0.0.1"
  port_env_var: "IBKR_TWS_PORT"
  client_id_env_var: "IBKR_CLIENT_ID"
  readonly_mode: false
  paper_only: true

risk:
  max_order_notional_usd: 1000
  max_daily_notional_usd: 5000
  max_open_positions: 10
  max_position_usd: 10000
  min_expected_move_bps: 700
  min_confidence: 0.60
  require_index_card_hash: true
  require_fresh_signal: true
  reject_if_card_after_trigger: true
  reject_duplicate_order_intent: true
